<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRM SHOP — Skate & Streetwear</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f4f0;color:#111}
header{background:#111;color:#fff;padding:18px 6%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:28px;font-weight:900;letter-spacing:2px}
nav a{color:#fff;text-decoration:none;margin:0 12px;font-weight:700}
.cart{background:#fff;color:#111;padding:10px 16px;border-radius:22px;font-weight:800;cursor:pointer}
.hero{padding:80px 6%;background:#d8ff3e;display:flex;align-items:center;justify-content:space-between;gap:30px}
.hero h1{font-size:clamp(48px,8vw,100px);line-height:.85;text-transform:uppercase}
.hero p{font-size:20px;margin:25px 0}
.btn{display:inline-block;border:0;background:#111;color:#fff;padding:14px 22px;border-radius:5px;font-weight:800;cursor:pointer}
.skate{font-size:130px;transform:rotate(-12deg)}
section{padding:55px 6%}
h2{font-size:36px;margin-bottom:25px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.filter{padding:10px 18px;border:2px solid #111;background:transparent;border-radius:20px;cursor:pointer;font-weight:700}
.filter.active,.filter:hover{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px #0000000d}
.pic{height:220px;background:#e7e7e2;display:flex;align-items:center;justify-content:center;font-size:85px}
.info{padding:18px}
.info h3{font-size:19px;margin-bottom:8px}
.price{font-weight:900;font-size:20px;margin:12px 0}
.add{width:100%;padding:12px;background:#111;color:#fff;border:0;border-radius:6px;font-weight:800;cursor:pointer}
.add:hover{background:#333}
footer{background:#111;color:#fff;text-align:center;padding:35px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:25px}
.close{float:right;background:none;border:0;font-size:25px;cursor:pointer}
.cart-item{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #ddd;padding:14px 0}
.total{font-size:24px;font-weight:900;margin:20px 0}
input{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #bbb;border-radius:6px}
.empty{text-align:center;padding:30px}
@media(max-width:700px){nav{display:none}.hero{padding:55px 6%}.skate{font-size:75px}section{padding:40px 5%}}
</style>
</head>
<body>

<header>
  <div class="logo">NRM SHOP</div>
  <nav><a href="#home">Home</a><a href="#products">Products</a><a href="#about">About</a></nav>
  <button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<main>
<section class="hero" id="home">
  <div>
    <h1>Ride.<br>Wear.<br>Repeat.</h1>
    <p>Skateboard essentials & streetwear for the crew.</p>
    <a href="#products" class="btn">SHOP NOW →</a>
  </div>
  <div class="skate">🛹</div>
</section>

<section id="products">
  <h2>Shop NRM</h2>
  <div class="filters">
    <button class="filter active" onclick="filterProducts('all',this)">All</button>
    <button class="filter" onclick="filterProducts('skate',this)">Skateboard</button>
    <button class="filter" onclick="filterProducts('clothes',this)">Clothing</button>
    <button class="filter" onclick="filterProducts('accessories',this)">Accessories</button>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="about">
  <h2>NRM SHOP</h2>
  <p>Built for skaters and streetwear lovers. Choose your gear, add it to your cart, and get ready to ride.</p>
</section>
</main>

<footer>© 2026 NRM SHOP • Skate & Streetwear</footer>

<div class="modal" id="modal">
 <div class="modal-box">
   <button class="close" onclick="closeCart()">×</button>
   <h2>Your Cart</h2>
   <div id="cartItems"></div>
   <div class="total">Total: ₱<span id="total">0</span></div>
   <button class="btn" style="width:100%" onclick="checkout()">CHECKOUT</button>
 </div>
</div>

<script>
const products=[
 {name:"NRM Classic Deck",price:1850,cat:"skate",icon:"🛹"},
 {name:"Street Trucks Set",price:1250,cat:"skate",icon:"⚙️"},
 {name:"Pro Skate Wheels",price:950,cat:"skate",icon:"⭕"},
 {name:"NRM Bearings",price:550,cat:"skate",icon:"🔩"},
 {name:"NRM Oversized Tee",price:699,cat:"clothes",icon:"👕"},
 {name:"NRM Skate Hoodie",price:1299,cat:"clothes",icon:"🧥"},
 {name:"NRM Cargo Pants",price:1099,cat:"clothes",icon:"👖"},
 {name:"NRM Snapback",price:499,cat:"accessories",icon:"🧢"},
 {name:"NRM Skate Bag",price:899,cat:"accessories",icon:"🎒"}
];
let cart=[];
function money(n){return n.toLocaleString('en-PH')}
function render(list=products){
 document.getElementById('grid').innerHTML=list.map((p,i)=>`
 <article class="card">
   <div class="pic">${p.icon}</div>
   <div class="info"><h3>${p.name}</h3><div class="price">₱${money(p.price)}</div>
   <button class="add" onclick="addToCart(${products.indexOf(p)})">ADD TO CART</button></div>
 </article>`).join('');
}
function filterProducts(cat,btn){
 document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
 render(cat==='all'?products:products.filter(p=>p.cat===cat));
}
function addToCart(i){cart.push(products[i]);updateCount();alert(products[i].name+" added to cart!")}
function updateCount(){document.getElementById('count').textContent=cart.length}
function openCart(){
 document.getElementById('modal').style.display='flex';
 const el=document.getElementById('cartItems');
 if(!cart.length){el.innerHTML='<div class="empty">Your cart is empty.</div>';document.getElementById('total').textContent='0';return}
 el.innerHTML=cart.map((p,i)=>`<div class="cart-item"><span>${p.icon} ${p.name}</span><b>₱${money(p.price)} <button onclick="removeItem(${i})">✕</button></b></div>`).join('');
 document.getElementById('total').textContent=money(cart.reduce((s,p)=>s+p.price,0));
}
function removeItem(i){cart.splice(i,1);updateCount();openCart()}
function closeCart(){document.getElementById('modal').style.display='none'}
function checkout(){
 if(!cart.length){alert('Your cart is empty.');return}
 const name=prompt('Enter your name:');
 if(!name)return;
 const address=prompt('Enter your delivery address:');
 if(!address)return;
 alert('Thank you, '+name+'! Your NRM SHOP order has been received.');
 cart=[];updateCount();closeCart();
}
render();
</script>
</body>
</html>
